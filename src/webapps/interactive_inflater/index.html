<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../utils/style.css" />
    <link rel="stylesheet" href="./inflater.css" />
    <title>Interactive Inflater</title>
  </head>
  <body>
    <div id="app">
      <nav id="menubar">
        <div class="menu">
          <button class="menu-title">File</button>
          <div class="menu-items">
            <button class="menu-item" id="load-item">Load Net...</button>
          </div>
        </div>
        <div class="menu">
          <button class="menu-title">Edit</button>
          <div class="menu-items">
            <button class="menu-item" id="undo-item" disabled>Undo<kbd>Ctrl+Z</kbd></button>
            <button class="menu-item" id="redo-item" disabled>Redo<kbd>Ctrl+Y</kbd></button>
          </div>
        </div>
        <div class="menu">
          <button class="menu-title">Colour</button>
          <div class="menu-items">
            <button class="menu-item" data-color-mode="polygon"><span class="check"></span>Polygon-specific<kbd>P</kbd></button>
            <button class="menu-item" data-color-mode="multi"><span class="check"></span>Multi-colour<kbd>M</kbd></button>
            <hr />
            <button class="menu-item" id="randomize-item">Randomize<kbd>R</kbd></button>
          </div>
        </div>
      </nav>

      <!-- Each pane's parts are direct grid items, so the two drawing areas share rows and line up exactly. -->
      <div id="interactive">
        <aside id="palette" class="pane-header" aria-label="Shapes"></aside>
        <fieldset id="setup" class="pane-header">
          <legend>Setup</legend>
          <!-- Browser-style controls above the 3D view: Back (undo), Forward (redo), Refresh (full inflate). -->
          <div id="nav-row" class="setup-row nav-buttons">
            <button id="undo-btn" type="button" class="nav-button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12H3M10 5l-7 7 7 7"/></svg>
            </button>
            <button id="redo-btn" type="button" class="nav-button" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M14 5l7 7-7 7"/></svg>
            </button>
            <button id="inflate-btn" type="button" class="nav-button" title="Re-inflate (full inflate)" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
            </button>
          </div>
          <!-- Debug mode only ('d'), as in the Python app's release vs debug split. -->
          <div id="debug-row" class="debug-row" hidden>
            <label><input type="checkbox" id="show-face-normals" /> Face normals</label>
            <label><input type="checkbox" id="show-vertex-normals" /> Vertex normals</label>
            <label><input type="checkbox" id="show-repulsive-forces" /> Repulsive forces</label>
            <div class="replay-control"><span>Replay</span><input type="range" id="replay-slider" min="0" max="0" value="0" disabled /></div>
          </div>
        </fieldset>

        <div id="canvas-area" class="drawing"><canvas id="net-canvas"></canvas></div>
        <div id="viewer" class="drawing"></div>

        <div id="builder-status" class="status"></div>
        <div id="inflater-status" class="status"></div>
      </div>
    </div>
    <dialog id="reject-dialog" class="reject-dialog">
      <p id="reject-message"></p>
      <form method="dialog">
        <button id="reject-ok" value="ok">OK</button>
      </form>
    </dialog>
    <input id="net-file" type="file" accept=".poly,.json" hidden />
    <script type="module" src="./main.ts"></script>
  </body>
</html>
